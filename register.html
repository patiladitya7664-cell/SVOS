<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SVOS - Register</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-logo">
                    🏡
                </div>

                <h1>Create Account</h1>

                <p>
                    Register for Smart Village Operating System
                </p>

            </div>


            <form id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="role">
                        Account Type
                    </label>

                    <select id="role" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="citizen">
                            Citizen
                        </option>

                        <option value="officer">
                            Panchayat Officer
                        </option>

                    </select>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create password"
                        required
                        minlength="6"
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                        minlength="6"
                    >

                </div>


                <!-- MESSAGE -->

                <div
                    id="registerMessage"
                    class="auth-message">
                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="btn btn-primary auth-btn">

                    Create Account

                </button>


            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="login.html">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>


    <script
        type="module"
        src="js/auth.js">
    </script>

</body>

</html>

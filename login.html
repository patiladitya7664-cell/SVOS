<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SVOS - Login</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">


            <div class="auth-header">

                <div class="auth-logo">
                    🏡
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to SVOS
                </p>

            </div>


            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="loginRole">
                        Account Type
                    </label>

                    <select id="loginRole" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="citizen">
                            Citizen
                        </option>

                        <option value="officer">
                            Panchayat Officer
                        </option>

                        <option value="admin">
                            Administrator
                        </option>

                    </select>

                </div>


                <!-- MESSAGE -->

                <div
                    id="loginMessage"
                    class="auth-message">
                </div>


                <button
                    type="submit"
                    class="btn btn-primary auth-btn">

                    Login

                </button>


            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="register.html">
                        Create Account
                    </a>
                </p>

            </div>


        </div>

    </div>


    <script
        type="module"
        src="js/auth.js">
    </script>

</body>

</html>
